<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>加碼完成</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #eef7f4;
            color: #16332e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eef7f4;
        }

        .confirmation {
            width: min(100%, 440px);
            padding: 36px 24px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #d3e9e1;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(28, 83, 70, 0.12);
        }

        .check {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #d9f3e8;
            color: #14734f;
            font-size: 32px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 1.75rem;
            line-height: 1.25;
        }

        .message {
            margin: 0;
            font-size: 1.25rem;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        time {
            color: #52736b;
            font-size: 0.9em;
        }

        strong {
            color: #14734f;
            font-weight: 750;
        }
    </style>
</head>
<body>
    <main class="confirmation">
        <div class="check" aria-hidden="true">&#10003;</div>
        <h1>加碼完成</h1>
        <p class="message">
            <time datetime="{{ today }}">{{ today }}</time><br>
            您已加碼 <strong>{{ symbol }}</strong>
        </p>
    </main>
</body>
</html>
